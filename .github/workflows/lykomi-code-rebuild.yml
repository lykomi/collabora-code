name: LYKOMI CODE source rebuild

on:
  push:
    branches: ['codex/code-vendor-abi']

permissions:
  contents: read

jobs:
  rebuild:
    if: github.repository == 'lykomi/collabora-code'
    name: Rebuild CODE server (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      CC: gcc-${{ matrix.compiler }}
      CXX: g++-${{ matrix.compiler }}
      # The pinned vendor AMD64 engine uses the legacy libstdc++ string ABI.
      # The matching ARM64 engine uses the current ABI.
      CPPFLAGS: -D_GLIBCXX_USE_CXX11_ABI=${{ matrix.string_abi }}
      EXPECTED_STRING_ABI: ${{ matrix.string_abi }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, compiler: 12, string_abi: 0 }
          - { arch: arm64, runner: ubuntu-24.04-arm, compiler: 13, string_abi: 1 }
    steps:
      - name: Free build space on the hosted runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h "$RUNNER_TEMP"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq
          sudo apt-get build-dep -y --no-install-recommends libreoffice
          sudo apt-get install -y --no-install-recommends \
            autoconf automake binutils build-essential "$CC" "$CXX" flex gperf libcap-dev libcap2-bin \
            libcppunit-dev libgif-dev libpam-dev libpng-dev libssl-dev libtool \
            libzstd-dev meson nasm ninja-build pkg-config python3-lxml python3-polib
      - name: Configure the Collabora Office build
        working-directory: engine
        run: |
          ./autogen.sh --with-distro=CPLinux-LOKit --disable-epm --without-package-format \
            --disable-symbols --disable-ccache --without-java --without-fonts --with-lang=en-US \
            --with-parallelism="$(nproc)"
      - name: Link and verify CODE executables
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          if make -C engine bootstrap \
            && make -C engine download fetch_EXTERN_TARBALLS= \
              fetch_SRC_TARBALLS='POCO_TARBALL OPENSSL_TARBALL EXPAT_TARBALL LIBPNG_TARBALL ZSTD_TARBALL' \
            && make -C engine -f Makefile.gbuild -j "$(nproc)" \
              Module_poco Module_openssl Module_expat Module_libpng Module_zstd \
            && bash lykomi/rebuild-server.sh "$RUNNER_TEMP/code-server"; then
            exit 0
          fi
          echo "Server-only build failed. Building the complete engine as documented upstream."
          # The targeted fetch records the normal download stamp. Clear it before full fetch.
          rm -f engine/workdir/download
          make -C engine
          bash lykomi/rebuild-server.sh "$RUNNER_TEMP/code-server"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: code-server-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/code-server.tar
          if-no-files-found: error
          retention-days: 7
