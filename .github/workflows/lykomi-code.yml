name: LYKOMI CODE candidate

on:
  pull_request:
    branches: ['release/26.04']
    paths:
      - '.github/workflows/lykomi-code.yml'
      - 'lykomi/**'
      - 'docker/cool-seccomp-profile.json'
      - 'engine/download.lst'
      - 'engine/Makefile.fetch'
      - 'engine/external/curl/**'

permissions:
  contents: read

concurrency:
  group: lykomi-code-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate:
    if: github.repository == 'lykomi/collabora-code'
    name: CODE candidate (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build candidate and verify library compatibility
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker buildx build --platform "$PLATFORM" --target candidate \
            --load --tag lykomi-code:ci lykomi
      - name: Start isolated editor and convert a test document
        run: bash lykomi/smoke.sh lykomi-code:ci docker/cool-seccomp-profile.json
